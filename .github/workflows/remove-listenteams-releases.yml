name: Remove ListenTeams releases

# One-off: deletes the releases published under Echo's former name (and their tags).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete ListenTeams 1.0.0 and 1.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in v1.0.0 v1.1.0; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || echo "$tag déjà supprimée"
          done
