name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version à publier en Release, par exemple 1.0.0 (vide = simple build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    name: Tests, app and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          $publish = "false"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            $publish = "true"
          } elseif ($env:RELEASE_INPUT) {
            if ($env:RELEASE_INPUT -notmatch '^\d+\.\d+\.\d+$') { throw "Version invalide : '$env:RELEASE_INPUT' (attendu : 1.2.3)" }
            $version = $env:RELEASE_INPUT
            $publish = "true"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: dotnet test tests/ListenTeams.Tests -c Release

      - name: Publish (self-contained, no .NET install needed)
        run: >-
          dotnet publish src/ListenTeams/ListenTeams.csproj -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }

      - name: Build ListenTeams-Setup.exe
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\ListenTeams.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: ListenTeams-Setup-${{ steps.version.outputs.version }}
          path: installer/Output/ListenTeams-Setup.exe
          if-no-files-found: error

      # On a v* tag, or when run by hand with a version: creates the tag and the Release.
      - name: GitHub release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ListenTeams ${{ steps.version.outputs.version }}
          files: installer/Output/ListenTeams-Setup.exe
          generate_release_notes: true
          body: |
            ## Installation
            1. Téléchargez **ListenTeams-Setup.exe** ci-dessous et lancez-le (aucun droit administrateur nécessaire, rien d'autre à installer).
            2. Choisissez les appels à enregistrer : **Teams**, **Discord** ou les deux (modifiable ensuite : clic droit sur l'icône → Applications à enregistrer).
            3. Teams : Paramètres → Confidentialité → Gérer l'API → **Activer l'API**, puis acceptez la demande de ListenTeams pendant votre premier appel. Discord : rien à configurer (gardez la fenêtre Discord ouverte pendant l'appel).
            4. Dans ListenTeams (icône près de l'horloge) → Paramètres → Synthèse : collez votre clé API Anthropic, ou choisissez Ollama (100 % local).

            Windows 10 version 2004 ou plus récent / Windows 11, 64 bits, applications de bureau Teams et/ou Discord.
